# 本地构建形态（显式可选路径，不是默认用法）
#
# 默认形态消费已发布镜像（docker-compose.yml 钉 manifest list digest）。
# 本文件把各服务切回本地构建：无网络、或要改代码后立即验证时使用。
#
# 用法（必须与主模板叠加，且带 --build）:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 说明:
#   - image 覆盖主模板的 digest 钉选，tag 统一 ha/<服务名>:${VERSION:-latest}；
#   - build context 指向兄弟仓库检出（相对本目录）。
#   - 各仓 Dockerfile 的 GO_VERSION 已与 go.mod 统一（1.26.10，2026-11-12），
#     默认不需要任何 build args；确需临时覆盖时仍可经
#     `docker compose build --build-arg GO_VERSION=...` 传入（ARG 可覆盖）。
#   - ha-services-deployer 本地构建前须先把静态二进制放入上下文：
#     CGO_ENABLED=0 go build -trimpath -o deploy/docker/hasd .

name: ha-platform

services:
  hrpauth:
    image: ha/hrpauth:${VERSION:-latest}
    build:
      context: ../../../hrpauth/HRPAuth

  hrpauth-yggdrasil-api:
    image: ha/hrpauth-yggdrasil-api:${VERSION:-latest}
    build:
      context: ../../../hrpauth/HRPAuth-Yggdrasil-API

  haskinlib:
    image: ha/haskinlib:${VERSION:-latest}
    build:
      context: ../../../hrpauth/HASkinLib

  haskinproxy:
    image: ha/haskinproxy:${VERSION:-latest}
    build:
      context: ../../../hrpauth/HASkinProxy

  winnerproxy:
    image: ha/winnerproxy:${VERSION:-latest}
    build:
      context: ../../../hrpauth/WinnerProxy

  mca-server:
    image: ha/mca-server:${VERSION:-latest}
    build:
      context: ../../../matchcore/MatchCoreArena-Server

  ha-webui-sdkhandler:
    image: ha/ha-webui-sdkhandler:${VERSION:-latest}
    build:
      context: ../../../hrpauth/HA-WebUI-SDKHandler

  ha-services-deployer:
    image: ha/ha-services-deployer:${VERSION:-latest}
    build:
      context: ..

  ha-services-maintenance-view:
    image: ha/ha-services-maintenance-view:${VERSION:-latest}
    build:
      context: ../../../maintanance/HA-Services-MaintenanceView
