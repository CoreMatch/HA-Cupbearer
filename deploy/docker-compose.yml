# HA 平台容器编排模板
#
# 用法:
#   cp .env.example .env && 编辑 .env (数据库/Redis 地址、密钥、上游 URL)
#   docker compose up -d --build
#
# 说明:
#   - MySQL / Redis 不在本编排内启动, 通过 .env 中的 DB_* / REDIS_* 指向外部实例。
#   - 每个服务的 YAML 配置由 deploy/config/*.yaml.tmpl 渲染而成, 容器启动时
#     用 envsubst 把 ${VAR} 替换为环境变量值, 因此所有可变项都由 .env 控制。
#   - 镜像在本地构建, tag 统一为 ha/<服务名>:<版本>。

name: ha-platform

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}
  DB_HOST: ${DB_HOST:?missing DB_HOST - set it in deploy/.env (see deploy/.env.example)}
  DB_PORT: ${DB_PORT:-3306}
  DB_USER: ${DB_USER:?missing DB_USER - set it in deploy/.env (see deploy/.env.example)}
  DB_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD - set it in deploy/.env (see deploy/.env.example)}
  DB_NAME: ${DB_NAME:-hrpa}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  SIGNATURE_KEY_DIR: ${SIGNATURE_KEY_DIR:-/app/secrets}

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hrpauth:
    build:
      context: ../HRPAuth
    image: ha/hrpauth:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HRPAUTH_PORT:-2778}:2778"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2778/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config.yaml
      HRPAUTH_URL: http://hrpauth:2778
      HRPAUTH_PUBLIC_URL: ${HRPAUTH_PUBLIC_URL}
      HRPAUTH_FRONTEND_URL: ${HRPAUTH_FRONTEND_URL}
      HRPAUTH_PUBLIC_CLIENT_ID: ${HRPAUTH_PUBLIC_CLIENT_ID:?missing HRPAUTH_PUBLIC_CLIENT_ID - set it in deploy/.env (see deploy/.env.example)}
      # super 凭据空值=安全缺口（空 secret 对空 secret 校验放行），宁可 compose
      # 起不来也不静默放过；值与 mca-server 段同源同一 .env 变量。
      HRPAUTH_SUPER_CLIENT_ID: ${HRPAUTH_SUPER_CLIENT_ID:?missing HRPAUTH_SUPER_CLIENT_ID - set it in deploy/.env (see deploy/.env.example)}
      HRPAUTH_SUPER_CLIENT_SECRET: ${HRPAUTH_SUPER_CLIENT_SECRET:?missing HRPAUTH_SUPER_CLIENT_SECRET - set it in deploy/.env (see deploy/.env.example); an empty super secret would authenticate empty-secret clients}
      # v13 oauth2.service_clients 种子：四个卫星服务 + HASkinLib 的专用客户端凭据。
      # 每对变量与对应服务自己配置中的凭据同源（同一个 .env 变量），
      # 保证"种子里的 secret"与"服务换令牌用的 secret"永远一致。
      # :? 语法保证缺值时 compose 直接报错，而不是带空值启动。
      WINNERPROXY_CLIENT_ID: ${WINNERPROXY_CLIENT_ID:?hrpauth requires WINNERPROXY_CLIENT_ID (oauth2.service_clients seed)}
      WINNERPROXY_CLIENT_SECRET: ${WINNERPROXY_CLIENT_SECRET:?hrpauth requires WINNERPROXY_CLIENT_SECRET (oauth2.service_clients seed)}
      YGG_CLIENT_ID: ${YGG_CLIENT_ID:?hrpauth requires YGG_CLIENT_ID (oauth2.service_clients seed)}
      YGG_CLIENT_SECRET: ${YGG_CLIENT_SECRET:?hrpauth requires YGG_CLIENT_SECRET (oauth2.service_clients seed)}
      HASKINPROXY_CLIENT_ID: ${HASKINPROXY_CLIENT_ID:?hrpauth requires HASKINPROXY_CLIENT_ID (oauth2.service_clients seed)}
      HASKINPROXY_CLIENT_SECRET: ${HASKINPROXY_CLIENT_SECRET:?hrpauth requires HASKINPROXY_CLIENT_SECRET (oauth2.service_clients seed)}
      SDKHANDLER_CLIENT_ID: ${SDKHANDLER_CLIENT_ID:?hrpauth requires SDKHANDLER_CLIENT_ID (oauth2.service_clients seed)}
      SDKHANDLER_CLIENT_SECRET: ${SDKHANDLER_CLIENT_SECRET:?hrpauth requires SDKHANDLER_CLIENT_SECRET (oauth2.service_clients seed)}
      # HASkinLib 种子行：与 haskinlib 服务自身 core_api 凭据同源同一 .env 变量。
      HASKINLIB_CLIENT_ID: ${HASKINLIB_CLIENT_ID:?hrpauth requires HASKINLIB_CLIENT_ID (oauth2.service_clients seed)}
      HASKINLIB_CLIENT_SECRET: ${HASKINLIB_CLIENT_SECRET:?hrpauth requires HASKINLIB_CLIENT_SECRET (oauth2.service_clients seed)}
      MANAGE_TOKEN: ${MANAGE_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@example.com}
    volumes:
      - ./config/hrpauth.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
      - ./secrets:/app/secrets:ro
      - hrpauth-data:/app/data
      # DEPRECATED：HRPAuth 自配置 v8 起不再读写 /app/storage（v11 代码中
      # 无任何引用）。仅为存量部署保留，勿在此卷写入新数据；确认旧数据
      # 无用后可随升级移除（见 README "Upgrade notes"）。
      - hrpauth-storage:/app/storage
      - hrpauth-cache:/app/cache
    logging: *common-logging

  hrpauth-yggdrasil-api:
    build:
      context: ../HRPAuth-Yggdrasil-API
    image: ha/hrpauth-yggdrasil-api:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${YGG_PORT:-2770}:2770"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2770/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config.yaml
      HRPAUTH_URL: http://hrpauth:2778
      YGG_PUBLIC_URL: ${YGG_PUBLIC_URL}
      # 服务凭据（v14 语义，必填）：填什么就按什么，运行时由服务自己判断——
      # 填 super 凭据 → 启动时经 POST /oauth/register 换取本服务低权限客户端
      # （client_id = presence 名 HRPAuth-Yggdrasil-API）；填本服务专用低权限对 →
      # 校验通过后直接使用（幂等路径，不发换取请求）。详见 .env.example。
      # 防呆：若把 super secret 填进这里，HRPAuth 种子会跳过本服务的种子条目
      # 并告警（避免 super secret 被复制成普通客户端行），本服务随后走自助
      # 注册拿到独立 secret。容器内配置写回不持久化，属预期。
      # :? 语法保证缺值时 compose 直接报错，而不是带空值启动。
      YGG_CLIENT_ID: ${YGG_CLIENT_ID:?hrpauth-yggdrasil-api requires YGG_CLIENT_ID (fill super creds or the dedicated low-priv pair, see .env.example)}
      YGG_CLIENT_SECRET: ${YGG_CLIENT_SECRET:?hrpauth-yggdrasil-api requires YGG_CLIENT_SECRET (fill super creds or the dedicated low-priv pair, see .env.example)}
    volumes:
      - ./config/hrpauth-yggdrasil-api.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
      - ./secrets:/app/secrets:ro
      # 与 haskinlib 共享同一份纹理存储（见 volumes.haskin-textures 注释）：
      # YGG 的 textures_storage=./storage，布局为 /app/storage/{textures,previews}。
      - haskin-textures:/app/storage
    depends_on:
      hrpauth:
        condition: service_healthy
    logging: *common-logging

  haskinlib:
    build:
      context: ../HASkinLib
    image: ha/haskinlib:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HASKINLIB_PORT:-2701}:2701"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2701/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config.yaml
      # 模板 core_api.base_url 消费（运行时调 HRPAuth /internal/verify-token 等）。
      HRPAUTH_URL: http://hrpauth:2778
      # 专用服务客户端凭据（HRPAuth 种子 client_id=haskinlib）：HASkinLib 无
      # presence、不走自助换取，直接注入（同 SDKHandler 模式）。secret 必须与
      # HRPAuth 渲染配置中种子行同值；:? 保证缺值时 compose 直接报错，而不是
      # 带空凭据启动后退化为无鉴权调用（运行时 401）。
      HASKINLIB_CLIENT_ID: ${HASKINLIB_CLIENT_ID:?haskinlib requires HASKINLIB_CLIENT_ID (dedicated seed pair, see .env.example)}
      HASKINLIB_CLIENT_SECRET: ${HASKINLIB_CLIENT_SECRET:?haskinlib requires HASKINLIB_CLIENT_SECRET (must equal the haskinlib seed secret in HRPAuth rendered config)}
    volumes:
      - ./config/haskinlib.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
      # 与 hrpauth-yggdrasil-api 共享同一份纹理存储（见 volumes.haskin-textures 注释）：
      # skinlib 上传写入 ./data/{textures,previews}，即卷内 /app/data/{textures,previews}。
      - haskin-textures:/app/data
    logging: *common-logging

  haskinproxy:
    build:
      context: ../HASkinProxy
    image: ha/haskinproxy:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HASKINPROXY_PORT:-2702}:2702"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2702/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config.yaml
      HRPAUTH_URL: http://hrpauth:2778
      HASKINPROXY_PUBLIC_URL: ${HASKINPROXY_PUBLIC_URL:?missing HASKINPROXY_PUBLIC_URL - set it in deploy/.env (see deploy/.env.example); empty silently skips relay registration}
      # 服务凭据（v14 语义，必填）：填什么就按什么，运行时由服务自己判断——
      # 填 super 凭据 → 启动时经 POST /oauth/register 换取本服务低权限客户端
      # （client_id = presence 名 HASkinProxy）；填本服务专用低权限对 →
      # 校验通过后直接使用（幂等路径，不发换取请求）。详见 .env.example。
      # 防呆：若把 super secret 填进这里，HRPAuth 种子会跳过本服务的种子条目
      # 并告警（避免 super secret 被复制成普通客户端行），本服务随后走自助
      # 注册拿到独立 secret。容器内配置写回不持久化，属预期。
      # :? 语法保证缺值时 compose 直接报错，而不是带空值启动。
      HASKINPROXY_CLIENT_ID: ${HASKINPROXY_CLIENT_ID:?haskinproxy requires HASKINPROXY_CLIENT_ID (fill super creds or the dedicated low-priv pair, see .env.example)}
      HASKINPROXY_CLIENT_SECRET: ${HASKINPROXY_CLIENT_SECRET:?haskinproxy requires HASKINPROXY_CLIENT_SECRET (fill super creds or the dedicated low-priv pair, see .env.example)}
    volumes:
      # 缺失该挂载时 entrypoint 的 [ -f ] 守卫会静默跳过渲染，服务退化为
      # 代码默认配置（upstream 不可达、凭据为空）且 /health 仍 200 掩盖坏状态。
      - ./config/haskinproxy.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
    depends_on:
      hrpauth:
        condition: service_healthy
    logging: *common-logging

  winnerproxy:
    build:
      context: ../WinnerProxy
    image: ha/winnerproxy:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${WINNERPROXY_PORT:-2777}:2777"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2777/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config.yml
      HRPAUTH_URL: http://hrpauth:2778
      # 直连 Yggdrasil-API 微服务容器，不带 relay 前缀：微服务本身提供
      # 无前缀路由，/yggdrasil-api 前缀只在经 HRPAuth 核心 relay（:2778）
      # 时才需要（作者 2026-11-05 拍板：以默认设置为准；
      # 见 WinnerProxy knowledge/0004 第 5 项）。
      HRPAUTH_YGG_URL: http://hrpauth-yggdrasil-api:2770
      WINNERPROXY_PUBLIC_URL: ${WINNERPROXY_PUBLIC_URL:?missing WINNERPROXY_PUBLIC_URL - set it in deploy/.env (see deploy/.env.example); empty silently skips relay registration}
      # 服务凭据（v14 语义，必填）：填什么就按什么，运行时由服务自己判断——
      # 填 super 凭据 → 启动时经 POST /oauth/register 换取本服务低权限客户端
      # （client_id = presence 名 WinnerProxy）；填本服务专用低权限对 →
      # 校验通过后直接使用（幂等路径，不发换取请求）。详见 .env.example。
      # 防呆：若把 super secret 填进这里，HRPAuth 种子会跳过本服务的种子条目
      # 并告警（避免 super secret 被复制成普通客户端行），本服务随后走自助
      # 注册拿到独立 secret。容器内配置写回不持久化，属预期。
      # :? 语法保证缺值时 compose 直接报错，而不是带空值启动。
      WINNERPROXY_CLIENT_ID: ${WINNERPROXY_CLIENT_ID:?winnerproxy requires WINNERPROXY_CLIENT_ID (fill super creds or the dedicated low-priv pair, see .env.example)}
      WINNERPROXY_CLIENT_SECRET: ${WINNERPROXY_CLIENT_SECRET:?winnerproxy requires WINNERPROXY_CLIENT_SECRET (fill super creds or the dedicated low-priv pair, see .env.example)}
    volumes:
      # 缺失该挂载时 entrypoint 的 [ -f ] 守卫会静默跳过渲染，服务以代码默认
      # 配置启动：upstreams.hrpauth 默认 enabled 且凭据为空 → 启动即 fatal
      # 崩溃循环（main.go 凭据校验），属响故障但仍属编排缺漏。
      - ./config/winnerproxy.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
    depends_on:
      hrpauth:
        condition: service_healthy
      hrpauth-yggdrasil-api:
        condition: service_healthy
    logging: *common-logging

  mca-server:
    build:
      context: ../MatchCoreArena-Server
    image: ha/mca-server:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${MCA_SERVER_PORT:-9178}:9178"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9178/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config/config.yaml
      CONFIG_PATH: /app/config/config.yaml
      # tokens.yaml（super-admin 凭据）指向持久卷，避免每次重启重新生成。
      MCA_TOKENS_PATH: /app/data/tokens.yaml
      # 模板 auth.hrpauth.* 消费的三个变量（此前悬空：模板引用但 compose
      # 未注入，渲染会变空串）：base_url 走 compose 网络直连；public_client_id
      # 与 maintenance_token 取自 .env。
      HRPAUTH_URL: http://hrpauth:2778
      HRPAUTH_PUBLIC_CLIENT_ID: ${HRPAUTH_PUBLIC_CLIENT_ID}
      MCA_MAINTENANCE_TOKEN: ${MCA_MAINTENANCE_TOKEN:?missing MCA_MAINTENANCE_TOKEN - set it in deploy/.env (see deploy/.env.example); empty silently disables OPS maintenance-token auth}
      # 服务身份（config 1.5.0）：注入 HRPAuth 内置 super client 凭据。
      # :? 语法保证缺值时 compose 直接报错，而不是带空值启动。
      HRPAUTH_SUPER_CLIENT_ID: ${HRPAUTH_SUPER_CLIENT_ID:?mca-server requires HRPAUTH_SUPER_CLIENT_ID (HRPAuth oauth2.super_client_id)}
      HRPAUTH_SUPER_CLIENT_SECRET: ${HRPAUTH_SUPER_CLIENT_SECRET:?mca-server requires HRPAUTH_SUPER_CLIENT_SECRET (HRPAuth oauth2.super_client_secret)}
      # 成局下发的游戏服务器地址（config 1.8.0 matchmaking.join_target）：
      # 留空 host 表示不启用，成局记录不带地址，客户端回落本地配置。
      MCA_JOIN_TARGET_HOST: ${MCA_JOIN_TARGET_HOST:-}
      MCA_JOIN_TARGET_PORT: ${MCA_JOIN_TARGET_PORT:-0}
    volumes:
      - ./config/mca-server.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
      - mca-data:/app/data
    depends_on:
      # 与其它消费 HRPAUTH_URL 的服务一致：等 HRPAuth 健康后再启动。
      hrpauth:
        condition: service_healthy
    logging: *common-logging

  ha-webui-sdkhandler:
    build:
      context: ../HA-WebUI-SDKHandler
    image: ha/ha-webui-sdkhandler:${VERSION:-latest}
    restart: unless-stopped
    ports:
      # 内部构建服务：默认仅绑定回环，服务间调用走 compose 网络，无需宿主暴露。
      # 确需远程维护时：把 SDKHANDLER_BIND 设为 0.0.0.0（或指定网卡 IP），
      # 并自行配置防火墙；/api/* 另有 X-Internal-Key 保护（未配置时 fail-closed）。
      - "${SDKHANDLER_BIND:-127.0.0.1}:${SDKHANDLER_PORT:-2704}:2704"
      - "${SDKHANDLER_BIND:-127.0.0.1}:${SDKHANDLER_MAINTENANCE_PORT:-2705}:2705"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2704/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config.yaml
      SDKHANDLER_CONFIG: /app/config.yaml
      HRPAUTH_URL: http://hrpauth:2778
      SDKHANDLER_CLIENT_ID: ${SDKHANDLER_CLIENT_ID}
      SDKHANDLER_CLIENT_SECRET: ${SDKHANDLER_CLIENT_SECRET}
      SDKHANDLER_INTERNAL_KEY: ${SDKHANDLER_INTERNAL_KEY}
      # 默认把模板克隆到可写卷 /app/template-src（容器以非 root 运行，
      # 代码默认值 ../HRPAuth-WebUI 落在根目录、不可写）。预置模板时
      # 在 .env 设 SDKHANDLER_TEMPLATE_DIR=/app/template（只读挂载）。
      SDKHANDLER_TEMPLATE_DIR: ${SDKHANDLER_TEMPLATE_DIR:-/app/template-src}
      SDKHANDLER_TEMPLATE_GIT_URL: ${SDKHANDLER_TEMPLATE_GIT_URL:-}
    volumes:
      - ./config/sdkhandler.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
      - ./sdkhandler-template:/app/template:ro
      # 自动克隆模板的可写落点（见上方 SDKHANDLER_TEMPLATE_DIR 注释）。
      - sdkhandler-template-src:/app/template-src
      - sdkhandler-state:/app/state
      - sdkhandler-artifacts:/app/artifacts
      - sdkhandler-work:/app/frontend-build
    depends_on:
      hrpauth:
        condition: service_healthy
    logging: *common-logging

  ha-services-deployer:
    build:
      context: ../HA-Services-Deployer
    image: ha/ha-services-deployer:${VERSION:-latest}
    restart: unless-stopped
    ports:
      # 内部下发服务：MaintenanceView 经 compose 网络访问，默认仅绑定回环。
      # 需要远程下载产物时把 DEPLOYER_BIND 改为 0.0.0.0 并配置防火墙。
      - "${DEPLOYER_BIND:-127.0.0.1}:${DEPLOYER_PORT:-18080}:18080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config.yaml
    volumes:
      - ./config/ha-services-deployer.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
      - deployer-data:/app/data
    logging: *common-logging

  ha-services-maintenance-view:
    build:
      context: ../HA-Services-MaintenanceView
    image: ha/ha-services-maintenance-view:${VERSION:-latest}
    restart: unless-stopped
    ports:
      # 运维面板（半成品、无鉴权）：默认仅绑定回环。
      # 远程访问请用 SSH 隧道；确需直接暴露时改 MAINTENANCEVIEW_BIND 并配防火墙。
      - "${MAINTENANCEVIEW_BIND:-127.0.0.1}:${MAINTENANCEVIEW_PORT:-18081}:18081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18081/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      <<: *common-env
      CONFIG_TEMPLATE: /etc/ha/config.yaml.tmpl
      RENDERED_CONFIG: /app/config.yaml
      DEPLOYER_URL: http://ha-services-deployer:18080
      MAINTENANCEVIEW_PUBLIC_URL: ${MAINTENANCEVIEW_PUBLIC_URL:?missing MAINTENANCEVIEW_PUBLIC_URL - set it in deploy/.env (see deploy/.env.example)}
    volumes:
      - ./config/ha-services-maintenance-view.yaml.tmpl:/etc/ha/config.yaml.tmpl:ro
      - maintenanceview-data:/app/data
    depends_on:
      ha-services-deployer:
        condition: service_healthy
    logging: *common-logging

  # 可选的 WebUI 静态托管（profile 门控，默认不启动）。
  # 启用方式: docker compose --profile webui up -d
  # 说明:
  #   - 只读挂载 sdkhandler-artifacts 卷 —— 即 HA-WebUI-SDKHandler 发布的
  #     前端产物；这是"构建与托管分离"设计中产物的消费方。
  #   - SPA fallback 由 deploy/nginx-sdkhandler-artifacts.conf 提供
  #     （非文件路径回落 index.html）。
  #   - 该服务是对外前端入口，默认监听所有网卡（WEBUI_BIND 可改 127.0.0.1
  #     仅限内网）；端口 WEBUI_PORT 默认 8080。
  ha-webui-nginx:
    image: nginx:1.27-alpine
    profiles: ["webui"]
    restart: unless-stopped
    ports:
      - "${WEBUI_BIND:-0.0.0.0}:${WEBUI_PORT:-8080}:80"
    volumes:
      - ./nginx-sdkhandler-artifacts.conf:/etc/nginx/conf.d/default.conf:ro
      - sdkhandler-artifacts:/usr/share/nginx/html:ro
    depends_on:
      ha-webui-sdkhandler:
        condition: service_healthy
    logging: *common-logging

volumes:
  hrpauth-data:
  # DEPRECATED（见 hrpauth 服务挂载处注释与 README "Upgrade notes"）。
  hrpauth-storage:
  hrpauth-cache:
  # HASkinLib 与 Yggdrasil-API 共用的纹理/预览存储（同一份内容，两个挂载点）：
  #   - haskinlib 挂载到 /app/data，配置路径 ./data/textures、./data/previews；
  #   - yggdrasil-api 挂载到 /app/storage，配置 textures_storage: ./storage，
  #     实际读写 ./storage/textures、./storage/previews。
  # 两者指向同一卷内同一目录结构，保证"上传后游戏内可见"。
  # （HASkinProxy 无本地存储，经 HRPAuth 上游代理，不参与该卷。）
  haskin-textures:
  mca-data:
  sdkhandler-state:
  # HA-WebUI-SDKHandler 发布的前端产物；消费方为可选的 ha-webui-nginx
  # （profile: webui）。不启用该 profile 时，卷内产物仅持久保存、无人托管。
  sdkhandler-artifacts:
  sdkhandler-work:
  # SDKHandler 自动克隆前端模板的可写落点（默认 SDKHANDLER_TEMPLATE_DIR）。
  sdkhandler-template-src:
  deployer-data:
  maintenanceview-data:
