# HA WebUI 静态托管（compose profile "webui" 的可选服务使用）。
#
# 挂载的根目录是 sdkhandler-artifacts 卷（HA-WebUI-SDKHandler 发布的前端
# 产物，构建与托管分离设计中的消费方）。
#
# 行为：
#   - 命中的真实文件直接返回；
#   - 未命中的路径回落 /index.html（SPA 前端路由）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
