# HA 平台基础设施（MySQL + Redis）——由 Cupbearer 首次运行初始化层
# 管理（一键拉起/幂等复用/健康等待）。按所选部署路径各自成立：
#
#   - 裸金属编排：为裸金属服务提供本地实例，进程连 宿主地址+发布端口
#     （127.0.0.1:3306 / :6379）；
#   - 容器编排：归 compose 一侧，服务连 服务名+容器口（mysql:3306 /
#     redis:6379），经 ha-infra 网络解析。
#
# 两种形态只是同一实例的不同寻址方式；已有可用实例时接管复用，不重复起。
#
# 数据持久：命名卷 ha-infra-mysql-data / ha-infra-redis-data，容器删了数据
# 不丢。彻底清除（不可逆）：
#   docker compose -f deploy/infra.yml down -v
# （-v 会连同数据卷一起删除；只停不删用 down 不带 -v。）
#
# 凭据纪律：MYSQL_ROOT_PASSWORD / REDIS_PASSWORD 由初始化层生成并经进程
# 环境注入（或 deploy/.env），绝不提交进仓库。

name: ha-infra

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD missing - generated by Cupbearer bootstrap}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 发布到回环：裸金属链路经宿主端口连接；只用容器链路时此发布
      # 可以按需移除（初始化向导会提示）。
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    environment:
      # 供 healthcheck 的 redis-cli 使用（容器内环境）。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD missing - generated by Cupbearer bootstrap}
    # appendonly：数据落盘，重启不丢。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD missing - generated by Cupbearer bootstrap}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
    name: ha-infra-mysql-data
  redis-data:
    name: ha-infra-redis-data

networks:
  # 命名网络供主栈（ha-platform）挂入后按服务名解析 mysql/redis。
  default:
    name: ha-infra
